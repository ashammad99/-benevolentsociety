<!-- BSD Admin — scripts.html partial (path-relative: set by each page) -->
<!-- logo.js and app.js paths are set per-page -->
<script>
/* Inject logo into all .js-logo images once logo.js has loaded */
document.addEventListener('DOMContentLoaded', function() {
  if (typeof BSD_LOGO !== 'undefined') {
    document.querySelectorAll('.js-logo').forEach(function(el) { el.src = BSD_LOGO; });
    var fav = document.getElementById('bsd-favicon');
    if (fav) fav.href = BSD_LOGO;
  }
});

/* Route-aware navigation helper used by sidebar buttons */
function getRoot() {
  return document.body.getAttribute('data-root') || '..';
}
function sidebarNav(page) {
  var root = getRoot();
  var map = {
    dashboard:  root + '/pages/dashboard.html',
    posts:      root + '/pages/posts/index.html',
    categories: root + '/pages/categories/index.html',
    media:      root + '/pages/media/index.html',
    ads:        root + '/pages/ads/index.html',
    users:      root + '/pages/users/index.html',
    settings:   root + '/pages/settings/index.html',
  };
  if (map[page]) window.location.href = map[page];
}
</script>
