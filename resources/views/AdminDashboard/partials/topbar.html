<!-- BSD Admin — topbar.html partial -->
<header class="topbar">
  <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="topbar-breadcrumb">
    <span><span class="en">Admin</span><span class="ar">الإدارة</span></span>
    <span class="bc-sep">›</span>
    <span class="bc-current" id="bcCurrent">Dashboard</span>
  </div>
  <div class="topbar-right">
    <div class="topbar-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search… / ابحث…" autocomplete="off">
    </div>
    <button class="icon-btn" onclick="showToast('No new notifications.','info')">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-dot"></span>
    </button>
    <div class="topbar-lang">
      <button class="tl-btn active" id="tl-en" onclick="setLang('en')">EN</button>
      <button class="tl-btn"        id="tl-ar" onclick="setLang('ar')">عر</button>
    </div>
    <div class="dropdown">
      <div class="topbar-avatar" data-dropdown title="Dana">D</div>
      <div class="dropdown-menu">
        <button class="dropdown-item">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="en">My Profile</span><span class="ar">ملفي الشخصي</span>
        </button>
        <button class="dropdown-item" onclick="sidebarNav('settings')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
          <span class="en">Settings</span><span class="ar">الإعدادات</span>
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" onclick="window.location.href=getRoot()+'/login.html'">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="en">Logout</span><span class="ar">تسجيل الخروج</span>
        </button>
      </div>
    </div>
  </div>
</header>
